[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "bhulekh-ai"
version = "0.1.0"
description = "BhuLekh-AI: Intelligent Land Record Digitization and Validation System"
requires-python = ">=3.11"

dependencies = [
    # ── Web framework ─────────────────────────────────────────────────────────
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",

    # ── Database ──────────────────────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "geoalchemy2>=0.15.0",
    "shapely>=2.0.5",

    # ── Queue ─────────────────────────────────────────────────────────────────
    "celery[redis]>=5.4.0",
    "redis>=5.0.4",
    "flower>=2.0.0",

    # ── Object storage ────────────────────────────────────────────────────────
    "minio>=7.2.7",

    # ── Auth ──────────────────────────────────────────────────────────────────
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "slowapi>=0.1.9",

    # ── CV and imaging ────────────────────────────────────────────────────────
    "opencv-python-headless>=4.10.0",
    "scikit-image>=0.24.0",
    "Pillow>=10.4.0",
    "numpy>=1.26.4",
    "pdf2image>=1.17.0",
    "python-magic>=0.4.27",
    "imagehash>=4.3.1",

    # ── OCR ───────────────────────────────────────────────────────────────────
    "paddlepaddle>=2.6.1",
    "paddleocr>=2.7.3",
    "pytesseract>=0.3.13",

    # ── NLP / matching ────────────────────────────────────────────────────────
    "spacy>=3.7.4",
    "rapidfuzz>=3.9.3",
    "jellyfish>=1.0.4",
    "indic-transliteration>=2.3.57",

    # ── Data ─────────────────────────────────────────────────────────────────
    "pandas>=2.2.2",
    "pyyaml>=6.0.1",
    "networkx>=3.3",
    "scikit-learn>=1.5.0",

    # ── Utilities ─────────────────────────────────────────────────────────────
    "python-dotenv>=1.0.1",
    "structlog>=24.2.0",
    "tenacity>=8.4.2",
    "aiofiles>=23.2.1",
    "pytz>=2024.1",
    "ulid-py>=1.1.0",
]

[project.optional-dependencies]
all = []
trocr = [
    "transformers>=4.44.0",
    "torch>=2.4.0",
]
ner = [
    "transformers>=4.44.0",
]
yolo = [
    "ultralytics>=8.2.0",
]
test = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
